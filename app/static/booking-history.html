<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking History | AndhraTrails</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-geo-alt-fill text-success"></i> Andhra<span class="text-success">Trails</span></a>
      <a href="/" class="btn btn-outline-success"><i class="bi bi-house"></i> Back to home</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="card col-lg-8 mx-auto">
      <div class="card-body p-4">
        <h2><i class="bi bi-clock-history text-success"></i> Booking History</h2>
        <p class="text-secondary">Enter the mobile number you used for booking.</p>

        <div class="input-group mb-2">
          <input type="text" id="historyMobile" class="form-control" placeholder="Mobile number">
          <button type="button" class="btn btn-success" onclick="findBookings()"><i class="bi bi-search"></i> Find bookings</button>
        </div>
        <p id="historyError" class="text-danger"></p>

        <div id="historyResults"></div>
        <p class="small text-secondary mt-3">Demo only: there is no login. Bookings are cleared when the server restarts.</p>
      </div>
    </div>
  </div>

  <script src="/static/js/history.js"></script>
</body>
</html>
